<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>날씨 3D</title>
  <style>
    :root { --navy: #14213d; --orange: #ff8a3d; --lime: #cfe86a; --card: #f6f6f6; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; color: var(--navy);
      background: linear-gradient(135deg, #a9dde2 0%, #d5d8cf 55%, #f1d6c8 100%); background-attachment: fixed; }
    .app { max-width: 1200px; margin: 24px auto; padding: 14px; background: #fff; border: 6px solid var(--navy); border-radius: 40px;
           display: grid; grid-template-columns: 76px 1fr; gap: 20px; }
    @media (max-width: 760px) { .app { margin: 0; border-radius: 0; border-width: 0; grid-template-columns: 1fr; } }

    /* sidebar */
    .side { background: #f6f6f6; border-radius: 28px; padding: 18px 0; display: flex; flex-direction: column; align-items: center; gap: 22px; }
    .side .logo { font-size: 30px; }
    .side i { font-style: normal; font-size: 18px; opacity: .45; }
    .side i.on { opacity: 1; color: var(--orange); }
    .side .grow { flex: 1; }
    @media (max-width: 760px) { .side { display: none; } }

    main { display: grid; gap: 18px; min-width: 0; }
    header { display: flex; align-items: center; gap: 14px; }
    .hello small { display: block; font-size: 11px; opacity: .6; }
    .hello b { font-size: 18px; }
    .search { flex: 1; background: #f1f1f1; border-radius: 999px; padding: 12px 20px; font-size: 13px; color: #888; }
    .dot { width: 42px; height: 42px; border-radius: 50%; background: #f1f1f1; display: grid; place-items: center; font-size: 15px; }
    @media (max-width: 760px) { .dot { display: none; } }

    .row1 { display: grid; grid-template-columns: 1fr 1.1fr; gap: 18px; }
    .row2 { display: grid; grid-template-columns: 1fr 1.1fr 0.9fr; gap: 18px; }
    @media (max-width: 960px) { .row1, .row2 { grid-template-columns: 1fr; } }

    .card { border-radius: 26px; padding: 22px; position: relative; overflow: hidden; }

    /* hero */
    .hero { min-height: 320px; background: linear-gradient(135deg, #b7e3e8, #e4dccd 60%, #f3d3c6); display: flex; flex-direction: column; }
    .pill { display: inline-block; background: #fff; border-radius: 999px; padding: 8px 16px; font-size: 13px; width: fit-content; }
    .hero h2 { font-size: 26px; font-weight: 500; margin: 26px 0 0; }
    .hero .now { font-size: 12px; opacity: .55; }
    .hero .big { font-size: 74px; font-weight: 600; margin-top: auto; line-height: 1; }
    .hero .sub { font-size: 12px; opacity: .6; margin-top: 6px; }
    .hero .icon { position: absolute; right: 26px; top: 26px; font-size: 110px; filter: drop-shadow(0 8px 14px #0002); }
    .chips { position: absolute; right: 22px; bottom: 22px; display: flex; gap: 10px; }
    @media (max-width: 560px) { .chips { position: static; margin-top: 14px; } .hero .icon { font-size: 80px; } .hero .big { font-size: 60px; } }
    .chip { border-radius: 14px; padding: 10px 16px; text-align: center; background: #fff; font-size: 11px; min-width: 84px; }
    .chip.lime { background: var(--lime); }
    .chip b { display: block; font-size: 17px; margin-top: 3px; }

    /* 3D panel (map slot) */
    .scene { padding: 0; min-height: 320px; background: #5a8fd0; }
    #scene { position: absolute; inset: 0; }
    #scene canvas { display: block; width: 100%; height: 100%; }
    .tag { position: absolute; left: 18px; bottom: 18px; background: #fff; border-radius: 14px; padding: 10px 16px; display: flex; gap: 12px; align-items: center; z-index: 1; }
    .tag .n { font-size: 26px; font-weight: 700; }
    .tag small { display: block; font-size: 11px; opacity: .65; }
    .hint { position: absolute; right: 16px; top: 14px; font-size: 11px; color: #fff; opacity: .85; z-index: 1; }

    /* row 2 */
    .cities { display: grid; gap: 12px; }
    .city { background: var(--card); border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
    .city .ic { font-size: 28px; }
    .city .nm { flex: 1; font-size: 13px; }
    .city .nm small { display: block; opacity: .55; font-size: 11px; }
    .city .tp { font-size: 13px; color: var(--orange); }
    .humid { background: var(--navy); color: #fff; border-radius: 22px; padding: 18px 20px; position: relative; min-height: 120px; margin-top: 12px; }
    .humid h3 { margin: 0; font-size: 17px; font-weight: 500; }
    .humid p { margin: 30px 0 0; font-size: 11px; opacity: .65; line-height: 1.5; }
    .humid .ic { position: absolute; right: 18px; top: 14px; font-size: 56px; }

    .metrics h3 { margin: 0 0 14px; font-size: 18px; font-weight: 500; }
    .cols { display: grid; grid-template-columns: repeat(4, 1fr); height: 190px; }
    .col { border-left: 1px solid #eee; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; font-size: 11px; opacity: .9; padding-bottom: 4px; }
    .col:first-child { border-left: 0; }
    .col .bubble { width: 38px; height: 38px; border-radius: 50%; background: #f1f1f1; display: grid; place-items: center; font-size: 16px; margin-bottom: auto; }
    .col:nth-child(2) .bubble { background: var(--navy); }
    .col b { font-size: 15px; }
    .col span { opacity: .6; }

    .tomorrow { background: linear-gradient(180deg, #d8ec8b, #c3e06a); }
    .tomorrow small { opacity: .6; font-size: 11px; }
    .tomorrow h3 { margin: 4px 0; font-size: 20px; font-weight: 500; }
    .tomorrow .figure { position: absolute; right: 12px; top: 56px; font-size: 90px; }
    .tomorrow .t2 { position: absolute; left: 22px; bottom: 18px; font-size: 26px; }
    .tomorrow .t2 small { display: block; }

    /* sidebar buttons */
    .side button { all: unset; cursor: pointer; width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 18px; opacity: .45; }
    .side button:hover { opacity: .85; background: #ececec; }
    .side button.on { opacity: 1; color: var(--orange); background: #fff; box-shadow: 0 2px 8px #0001; }
    .side .logo { cursor: pointer; }
    .settings { position: absolute; left: 70px; bottom: 20px; background: #fff; border-radius: 16px; padding: 14px 16px; box-shadow: 0 8px 28px #0003; z-index: 10; font-size: 13px; min-width: 150px; }
    .settings[hidden] { display: none; }
    .settings b { display: block; margin-bottom: 8px; }
    .seg { display: flex; gap: 6px; }
    .seg button { all: unset; cursor: pointer; flex: 1; text-align: center; padding: 7px 0; border-radius: 10px; background: #f1f1f1; opacity: 1; width: auto; height: auto; font-size: 13px; }
    .seg button.on { background: var(--navy); color: #fff; }
    .side { position: relative; }

    /* search */
    .searchwrap { flex: 1; position: relative; }
    .searchwrap input { width: 100%; border: 0; outline: 0; background: #f1f1f1; border-radius: 999px; padding: 12px 20px; font: inherit; font-size: 13px; color: var(--navy); }
    .searchwrap input:focus { box-shadow: 0 0 0 2px var(--orange); }
    .results { position: absolute; top: 48px; left: 0; right: 0; background: #fff; border-radius: 16px; box-shadow: 0 10px 30px #0003; padding: 6px; z-index: 20; max-height: 280px; overflow: auto; }
    .results[hidden] { display: none; }
    .results div { padding: 9px 14px; border-radius: 10px; font-size: 13px; cursor: pointer; }
    .results div:hover, .results div.hl { background: #f1f1f1; }
    .results small { opacity: .5; margin-left: 8px; }
    .city { cursor: pointer; }
    .city:hover { background: #ececec; }

    /* extra views */
    .view[hidden] { display: none; }
    .view h2 { margin: 4px 4px 14px; font-size: 20px; font-weight: 600; }
    .allgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
    .allgrid .city { flex-direction: column; align-items: flex-start; gap: 4px; }
    .hist { background: var(--card); border-radius: 22px; padding: 18px; display: grid; gap: 8px; }
    .hrow { display: grid; grid-template-columns: 90px 1fr 70px; gap: 10px; align-items: center; font-size: 12px; }
    .hbar { height: 10px; border-radius: 6px; background: linear-gradient(90deg, #4aa3ff, var(--orange)); }
    .empty { padding: 20px; opacity: .6; font-size: 13px; }

    #status { font-size: 12px; color: #c0392b; word-break: break-all; padding: 0 4px; }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="logo" data-view="dash" title="홈">⛅</div>
      <button data-view="dash" class="on" title="대시보드">▣</button>
      <button data-view="all" title="전국 도시 비교">☰</button>
      <button id="locBtn" title="내 위치 날씨">⌖</button>
      <button data-view="hist" title="저장된 기록 (Supabase)">▦</button>
      <button id="setBtn" title="설정">⚙</button>
      <div class="grow"></div>
      <button id="refBtn" title="새로고침">↻</button>
      <div class="settings" id="settings" hidden>
        <b>온도 단위</b>
        <div class="seg"><button data-unit="C" class="on">°C</button><button data-unit="F">°F</button></div>
      </div>
    </aside>

    <main>
      <header>
        <div class="hello"><small>안녕하세요</small><b>기상청 실시간 날씨</b></div>
        <div class="searchwrap">
          <input id="q" type="search" placeholder="도시 검색 (예: 부산, 제주)" autocomplete="off">
          <div class="results" id="results" hidden></div>
        </div>
        <div class="dot">▦</div><div class="dot">✉</div><div class="dot">🔔</div>
      </header>

      <div id="status"></div>

      <div class="view" id="view-dash">
      <section class="row1">
        <div class="card hero">
          <span class="pill">📍 <span id="cityName">서울</span></span>
          <h2>Weather</h2>
          <div class="now">Now · <span id="when">--</span></div>
          <div class="icon" id="heroIcon">⛅</div>
          <div class="big"><span id="t">--</span><span class="u">°C</span></div>
          <div class="sub" id="state">불러오는 중…</div>
          <div class="chips">
            <div class="chip lime">풍속<b><span id="w">-</span> m/s</b></div>
            <div class="chip">습도<b><span id="h">-</span>%</b></div>
          </div>
        </div>

        <div class="card scene">
          <div id="scene"></div>
          <div class="hint">드래그로 회전 · 휠로 확대</div>
          <div class="tag"><span class="n"><span id="t2">--</span><span class="u">°C</span></span><small><span id="day">-</span><br><span id="state2">-</span></small></div>
        </div>
      </section>

      <section class="row2">
        <div>
          <div class="cities" id="cities"></div>
          <div class="humid">
            <h3>Humidity</h3>
            <div class="ic" id="humIcon">🌤️</div>
            <p>1시간 강수량 <span id="r">-</span> mm<br>습도 <span id="h2">-</span>%</p>
          </div>
        </div>

        <div class="card metrics" style="background:#fff;padding:6px 6px 0">
          <h3>오늘 <span id="cityName2">서울</span>의 날씨 지표</h3>
          <div class="cols">
            <div class="col"><div class="bubble">🌡️</div><b><span id="m1">-</span><span class="u">°C</span></b><span>기온</span></div>
            <div class="col"><div class="bubble">💧</div><b><span id="m2">-</span>%</b><span>습도</span></div>
            <div class="col"><div class="bubble">🌬️</div><b><span id="m3">-</span></b><span>풍속 m/s</span></div>
            <div class="col"><div class="bubble">🧭</div><b><span id="m4">-</span>°</b><span>풍향</span></div>
          </div>
        </div>

        <div class="card tomorrow">
          <small>Today</small>
          <h3 id="cityName3">서울</h3>
          <div class="figure" id="figure">🌤️</div>
          <div class="t2"><span id="t3">--</span><span class="u">°C</span><small id="state3">-</small></div>
        </div>
      </section>
      </div>

      <div class="view" id="view-all" hidden>
        <h2>전국 주요 도시 날씨</h2>
        <div class="allgrid" id="allgrid"></div>
      </div>

      <div class="view" id="view-hist" hidden>
        <h2><span id="histCity">서울</span> · 저장된 관측 기록 (최근 24건)</h2>
        <div class="hist" id="hist"></div>
      </div>
    </main>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const $ = (id) => document.getElementById(id);
    const PTY = { 0: '강수 없음', 1: '비', 2: '비/눈', 3: '눈', 5: '빗방울', 6: '빗방울눈날림', 7: '눈날림' };
    const iconOf = (d) => ({ 1: '🌧️', 2: '🌨️', 3: '❄️', 5: '🌦️', 6: '🌨️', 7: '❄️' }[d.precipitationType]
      ?? (d.humidity >= 80 ? '☁️' : d.temperature >= 28 ? '☀️' : '⛅'));
    const CITIES = [
      { name: '서울', nx: 60, ny: 127 }, { name: '부산', nx: 98, ny: 76 },
      { name: '제주', nx: 52, ny: 38 }, { name: '대구', nx: 89, ny: 90 },
    ];

    // 날씨 상태 (API 응답으로 갱신, 실패하면 기본값으로 장면만 보여줌)
    const state = { temperature: 15, humidity: 50, rain1h: 0, windSpeed: 2, windU: 1, windV: 0, precipitationType: 0 };

    // ---------- Scene ----------
    const host = $('scene');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 500);
    camera.position.set(0, 9, 24);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    host.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 4, 0);
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.enableDamping = true;
    controls.enableZoom = false; // 페이지 스크롤과 충돌 방지

    const sun = new THREE.DirectionalLight(0xffffff, 2);
    sun.position.set(10, 20, 8);
    scene.add(sun, new THREE.AmbientLight(0xffffff, 0.6));

    const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 64), new THREE.MeshStandardMaterial({ color: 0x4f8f5a, roughness: 1 }));
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // 온도계: 높이 = 기온 (-20 ~ 40 ℃)
    const thermo = new THREE.Group();
    const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 12, 24), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.25 }));
    tube.position.y = 6;
    const mercury = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 1, 24), new THREE.MeshStandardMaterial({ color: 0xff3b30, emissive: 0x330000 }));
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.7, 24, 24), mercury.material);
    bulb.position.y = 0.2;
    thermo.add(tube, mercury, bulb);
    thermo.position.set(-8, 0, 0);
    scene.add(thermo);

    // 바람 화살표: 바람이 부는 방향 (UUU 동, VVV 북 → three 좌표 x, -z)
    const windArrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(8, 6, 0), 5, 0x00d4ff, 1.4, 0.8);
    scene.add(windArrow);

    // 구름: 풍속/습도에 따라 흐르는 속도와 개수가 달라짐
    const clouds = [];
    const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, roughness: 1 });
    for (let i = 0; i < 14; i++) {
      const g = new THREE.Group();
      for (let j = 0; j < 4; j++) {
        const s = new THREE.Mesh(new THREE.SphereGeometry(1.2 + Math.random() * 1.2, 16, 16), cloudMat);
        s.position.set(j * 1.4 - 2, Math.random() * 0.6, Math.random() * 1.2);
        g.add(s);
      }
      g.position.set((Math.random() - 0.5) * 70, 14 + Math.random() * 5, (Math.random() - 0.5) * 40);
      scene.add(g);
      clouds.push(g);
    }

    // 강수 입자
    const N = 3000;
    const pPos = new Float32Array(N * 3);
    const pGeo = new THREE.BufferGeometry();
    for (let i = 0; i < N; i++) {
      pPos[i * 3] = (Math.random() - 0.5) * 50;
      pPos[i * 3 + 1] = Math.random() * 25;
      pPos[i * 3 + 2] = (Math.random() - 0.5) * 50;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const pMat = new THREE.PointsMaterial({ color: 0x9ecbff, size: 0.12, transparent: true });
    const precip = new THREE.Points(pGeo, pMat);
    scene.add(precip);

    // ---------- 상태 → 장면 반영 ----------
    const lerpColor = (a, b, t) => new THREE.Color(a).lerp(new THREE.Color(b), Math.min(1, Math.max(0, t)));
    function applyState() {
      const s = state;
      const tNorm = (s.temperature + 20) / 60;
      const dim = s.precipitationType ? 0.55 : 1;
      const sky = lerpColor(0x5a6b85, lerpColor(0x4aa3ff, 0xffa24a, (s.temperature - 20) / 20), (1 - s.humidity / 100) * 0.6 + 0.4).multiplyScalar(dim);
      scene.background = sky;
      scene.fog = new THREE.FogExp2(sky, 0.006 + (s.humidity / 100) * 0.02);
      sun.intensity = 2 * dim;

      const h = Math.max(0.3, tNorm * 12);
      mercury.scale.y = h;
      mercury.position.y = h / 2 + 0.2;
      mercury.material.color.set(lerpColor(0x3b82f6, 0xff3b30, tNorm));

      const dir = new THREE.Vector3(s.windU, 0, -s.windV);
      const len = dir.length();
      if (len > 0.01) windArrow.setDirection(dir.normalize());
      windArrow.setLength(1 + Math.min(len, 15) * 0.5, 1.4, 0.8);

      const snow = [2, 3, 6, 7].includes(s.precipitationType);
      pMat.color.set(snow ? 0xffffff : 0x9ecbff);
      pMat.size = snow ? 0.22 : 0.12;
      precip.visible = s.precipitationType !== 0;

      cloudMat.color.set(s.precipitationType ? 0x7d8794 : 0xffffff);
      clouds.forEach((c, i) => (c.visible = i < 3 + Math.round((s.humidity / 100) * 11)));
    }
    applyState();

    function resize() {
      const { clientWidth: w, clientHeight: h } = host;
      if (!w || !h) return;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(host);
    resize();

    // ---------- 애니메이션 ----------
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      const wx = state.windU, wz = -state.windV;
      clouds.forEach((c) => {
        c.position.x += wx * dt * 0.8;
        c.position.z += wz * dt * 0.8;
        if (Math.abs(c.position.x) > 40) c.position.x *= -0.95;
        if (Math.abs(c.position.z) > 25) c.position.z *= -0.95;
      });
      if (precip.visible) {
        const snow = pMat.size > 0.15;
        const fall = snow ? 2.5 : 18;
        const a = precip.geometry.attributes.position;
        for (let i = 0; i < N; i++) {
          a.array[i * 3 + 1] -= fall * dt;
          a.array[i * 3] += wx * dt * 0.7 + (snow ? Math.sin(clock.elapsedTime + i) * dt * 0.5 : 0);
          a.array[i * 3 + 2] += wz * dt * 0.7;
          if (a.array[i * 3 + 1] < 0) {
            a.array[i * 3 + 1] = 25;
            a.array[i * 3] = (Math.random() - 0.5) * 50;
            a.array[i * 3 + 2] = (Math.random() - 0.5) * 50;
          }
        }
        a.needsUpdate = true;
      }
      controls.update();
      renderer.render(scene, camera);
    });

    // ---------- 데이터 ----------
    const CITY_LIST = [
      { name: '서울', nx: 60, ny: 127 }, { name: '부산', nx: 98, ny: 76 }, { name: '대구', nx: 89, ny: 90 },
      { name: '인천', nx: 55, ny: 124 }, { name: '광주', nx: 58, ny: 74 }, { name: '대전', nx: 67, ny: 100 },
      { name: '울산', nx: 102, ny: 84 }, { name: '세종', nx: 66, ny: 103 }, { name: '수원', nx: 60, ny: 121 },
      { name: '춘천', nx: 73, ny: 134 }, { name: '강릉', nx: 92, ny: 131 }, { name: '청주', nx: 69, ny: 107 },
      { name: '전주', nx: 63, ny: 89 }, { name: '포항', nx: 102, ny: 94 }, { name: '창원', nx: 90, ny: 77 },
      { name: '안동', nx: 91, ny: 106 }, { name: '목포', nx: 50, ny: 67 }, { name: '여수', nx: 73, ny: 66 },
      { name: '제주', nx: 52, ny: 38 }, { name: '서귀포', nx: 52, ny: 33 },
    ];
    const QUICK = ['서울', '부산', '제주', '대구', '인천'];
    const safe = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
    const save = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

    let unit = safe('unit') === 'F' ? 'F' : 'C';
    let current = CITY_LIST.find((c) => c.name === safe('city')) ?? CITY_LIST[0];
    const cache = new Map();

    const load = (c) => {
      const key = `${c.nx},${c.ny}`;
      if (!cache.has(key)) {
        cache.set(key, fetch(`/api/weather?nx=${c.nx}&ny=${c.ny}`).then((r) =>
          r.json().then((d) => (r.ok ? d : Promise.reject([d.error, d.code, d.detail].filter(Boolean).join(' | '))))
        ).catch((e) => { cache.delete(key); throw e; }));
      }
      return cache.get(key);
    };
    const fT = (c) => (c == null ? '-' : unit === 'F' ? Math.round((c * 9 / 5 + 32) * 10) / 10 : c);
    const setUnitLabels = () => document.querySelectorAll('.u').forEach((el) => (el.textContent = '°' + unit));

    const DAYS = ['일', '월', '화', '수', '목', '금', '토'];
    $('day').textContent = DAYS[new Date().getDay()] + '요일';

    let lastData = null;
    function render(d) {
      lastData = d;
      for (const k of Object.keys(state)) if (d[k] !== null && d[k] !== undefined) state[k] = d[k];
      const label = PTY[d.precipitationType] ?? '-';
      const ic = iconOf(d);
      for (const id of ['t', 't2', 't3', 'm1']) $(id).textContent = fT(d.temperature);
      for (const id of ['h', 'h2', 'm2']) $(id).textContent = d.humidity;
      for (const id of ['w', 'm3']) $(id).textContent = d.windSpeed;
      $('m4').textContent = d.windDirection;
      $('r').textContent = d.rain1h;
      for (const id of ['state', 'state2', 'state3']) $(id).textContent = label;
      for (const id of ['heroIcon', 'figure', 'humIcon']) $(id).textContent = ic;
      $('when').textContent = `${d.baseDate.slice(4, 6)}/${d.baseDate.slice(6)} ${d.baseTime.slice(0, 2)}:00`;
      $('status').textContent = d.db?.saved || d.db?.reason === 'Supabase 환경변수 없음' ? '' : 'DB 미저장: ' + (d.db?.reason ?? '');
      applyState();
    }

    function renderQuick() {
      const box = $('cities');
      box.innerHTML = '';
      CITY_LIST.filter((c) => QUICK.includes(c.name) && c.name !== current.name).slice(0, 3).forEach((c) => {
        const el = document.createElement('div');
        el.className = 'city';
        el.innerHTML = `<span class="ic">…</span><span class="nm">${c.name}<small>불러오는 중</small></span><span class="tp"></span>`;
        el.onclick = () => selectCity(c);
        box.appendChild(el);
        fillCity(el, c);
      });
    }
    function fillCity(el, c) {
      load(c)
        .then((d) => {
          el.querySelector('.ic').textContent = iconOf(d);
          el.querySelector('small').textContent = PTY[d.precipitationType];
          el.querySelector('.tp').textContent = `${fT(d.temperature)}°${unit} · ${d.humidity}%`;
          el.dataset.t = d.temperature; el.dataset.h = d.humidity;
        })
        .catch(() => { el.querySelector('.ic').textContent = '⚠️'; el.querySelector('small').textContent = '불러오기 실패'; });
    }

    function selectCity(c, { fromSearch = false } = {}) {
      current = c;
      if (CITY_LIST.some((x) => x.name === c.name)) save('city', c.name);
      for (const id of ['cityName', 'cityName2', 'cityName3']) $(id).textContent = c.name;
      $('histCity').textContent = c.name;
      $('state').textContent = '불러오는 중…';
      if (fromSearch) { $('q').value = ''; hideResults(); }
      showView('dash');
      renderQuick();
      load(c).then(render).catch((e) => { $('status').textContent = '오류: ' + e; $('state').textContent = '데이터 없음'; });
    }

    // ---------- 검색 ----------
    const results = $('results');
    let hl = -1, shown = [];
    function hideResults() { results.hidden = true; hl = -1; }
    function showResults(list) {
      shown = list;
      hl = list.length ? 0 : -1;
      results.innerHTML = list.length
        ? list.map((c, i) => `<div data-i="${i}" class="${i === hl ? 'hl' : ''}">${c.name}<small>격자 ${c.nx},${c.ny}</small></div>`).join('')
        : '<div style="cursor:default;opacity:.6">검색 결과가 없습니다</div>';
      results.hidden = false;
    }
    const matches = (v) => CITY_LIST.filter((c) => c.name.includes(v.trim()));
    $('q').addEventListener('input', (e) => (e.target.value.trim() ? showResults(matches(e.target.value)) : hideResults()));
    $('q').addEventListener('focus', (e) => showResults(e.target.value.trim() ? matches(e.target.value) : CITY_LIST));
    $('q').addEventListener('keydown', (e) => {
      if (results.hidden) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        hl = (hl + (e.key === 'ArrowDown' ? 1 : -1) + shown.length) % (shown.length || 1);
        [...results.children].forEach((el, i) => el.classList.toggle('hl', i === hl));
      } else if (e.key === 'Enter' && shown[hl]) selectCity(shown[hl], { fromSearch: true });
      else if (e.key === 'Escape') hideResults();
    });
    results.addEventListener('mousedown', (e) => {
      const el = e.target.closest('[data-i]');
      if (el) selectCity(shown[el.dataset.i], { fromSearch: true });
    });
    $('q').addEventListener('blur', () => setTimeout(hideResults, 120));

    // ---------- 사이드바 ----------
    const views = ['dash', 'all', 'hist'];
    function showView(v) {
      views.forEach((n) => ($('view-' + n).hidden = n !== v));
      document.querySelectorAll('.side button[data-view]').forEach((b) => b.classList.toggle('on', b.dataset.view === v));
      $('locBtn').classList.remove('on');
      if (v === 'all') loadAll();
      if (v === 'hist') loadHistory();
    }
    document.querySelectorAll('[data-view]').forEach((el) => el.addEventListener('click', () => showView(el.dataset.view)));

    function loadAll() {
      const g = $('allgrid');
      if (g.children.length) {
        [...g.children].forEach((el, i) => {
          const t = el.dataset.t;
          if (t) el.querySelector('.tp').textContent = `${fT(+t)}°${unit} · ${el.dataset.h}%`;
        });
        return;
      }
      CITY_LIST.forEach((c) => {
        const el = document.createElement('div');
        el.className = 'city';
        el.innerHTML = `<span class="ic">…</span><span class="nm">${c.name}<small>불러오는 중</small></span><span class="tp"></span>`;
        el.onclick = () => selectCity(c);
        g.appendChild(el);
        fillCity(el, c);
      });
    }

    function loadHistory() {
      const box = $('hist');
      box.innerHTML = '<div class="empty">불러오는 중…</div>';
      fetch(`/api/history?nx=${current.nx}&ny=${current.ny}`)
        .then((r) => r.json().then((d) => (r.ok ? d : Promise.reject(d.error))))
        .then((rows) => {
          if (!rows.length) { box.innerHTML = '<div class="empty">저장된 기록이 없습니다. 도시를 선택하면 관측값이 저장됩니다.</div>'; return; }
          box.innerHTML = rows.map((r) => {
            const d = new Date(r.observed_at);
            const w = Math.min(100, Math.max(6, ((r.temperature + 20) / 60) * 100));
            return `<div class="hrow"><span>${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:00</span><div class="hbar" style="width:${w}%"></div><b>${fT(r.temperature)}°${unit}</b></div>`;
          }).join('');
        })
        .catch((e) => { box.innerHTML = `<div class="empty">기록을 불러오지 못했습니다: ${e}</div>`; });
    }

    // 내 위치: 위경도 → 기상청 격자(LCC) 변환
    function toGrid(lat, lon) {
      const D = Math.PI / 180, re = 6371.00877 / 5, s1 = 30 * D, s2 = 60 * D, ol = 126 * D, oa = 38 * D;
      let sn = Math.tan(Math.PI * 0.25 + s2 * 0.5) / Math.tan(Math.PI * 0.25 + s1 * 0.5);
      sn = Math.log(Math.cos(s1) / Math.cos(s2)) / Math.log(sn);
      let sf = Math.tan(Math.PI * 0.25 + s1 * 0.5);
      sf = (Math.pow(sf, sn) * Math.cos(s1)) / sn;
      let ro = Math.tan(Math.PI * 0.25 + oa * 0.5);
      ro = (re * sf) / Math.pow(ro, sn);
      let ra = Math.tan(Math.PI * 0.25 + lat * D * 0.5);
      ra = (re * sf) / Math.pow(ra, sn);
      let th = lon * D - ol;
      if (th > Math.PI) th -= 2 * Math.PI;
      if (th < -Math.PI) th += 2 * Math.PI;
      th *= sn;
      return { nx: Math.floor(ra * Math.sin(th) + 43 + 0.5), ny: Math.floor(ro - ra * Math.cos(th) + 136 + 0.5) };
    }
    $('locBtn').addEventListener('click', () => {
      if (!navigator.geolocation) { $('status').textContent = '이 브라우저는 위치 기능을 지원하지 않습니다.'; return; }
      $('status').textContent = '위치 확인 중…';
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          $('status').textContent = '';
          const g = toGrid(pos.coords.latitude, pos.coords.longitude);
          selectCity({ name: '내 위치', ...g });
          $('locBtn').classList.add('on');
          document.querySelectorAll('.side button[data-view]').forEach((b) => b.classList.remove('on'));
        },
        () => { $('status').textContent = '위치 권한이 거부되었거나 확인할 수 없습니다. 브라우저 설정에서 허용해 주세요.'; }
      );
    });

    // 설정: 온도 단위
    $('setBtn').addEventListener('click', (e) => { e.stopPropagation(); $('settings').hidden = !$('settings').hidden; });
    document.addEventListener('click', (e) => { if (!e.target.closest('#settings')) $('settings').hidden = true; });
    document.querySelectorAll('[data-unit]').forEach((b) =>
      b.addEventListener('click', () => {
        unit = b.dataset.unit;
        save('unit', unit);
        document.querySelectorAll('[data-unit]').forEach((x) => x.classList.toggle('on', x === b));
        setUnitLabels();
        if (lastData) render(lastData);
        renderQuick();
        if (!$('view-all').hidden) loadAll();
        if (!$('view-hist').hidden) loadHistory();
      })
    );
    document.querySelectorAll('[data-unit]').forEach((x) => x.classList.toggle('on', x.dataset.unit === unit));

    // 새로고침: 캐시 비우고 다시 불러오기
    $('refBtn').addEventListener('click', () => { cache.clear(); $('allgrid').innerHTML = ''; selectCity(current); });

    setUnitLabels();
    selectCity(current);
  </script>
</body>
</html>
